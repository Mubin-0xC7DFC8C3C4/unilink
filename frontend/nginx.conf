# UniLink frontend — single-origin serving, matching the application design:
# the SPA and the API share one origin; /api and /ws are proxied to the
# backend service so session cookies and CSRF work without CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + WebSocket (STOMP) proxy to the backend.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin portal entry (separate Vite entry point).
    location /admin {
        try_files $uri $uri/ /admin.html;
    }
    # Student app SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML entries.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html  { add_header Cache-Control "no-store"; }
    location = /admin.html  { add_header Cache-Control "no-store"; }

    client_max_body_size 11m;
}
