# PROD: fail fast on missing values — every variable below has NO default.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
server:
  servlet:
    session:
      cookie:
        secure: true
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
app:
  encryption-key: ${ENCRYPTION_KEY}
  storage:
    # Uploaded files must survive restarts/redeploys: an absolute path on a
    # persistent volume (mounted at /data/unilink/storage in the production
    # compose stack). Never the container's ephemeral working directory.
    local-path: ${LOCAL_STORAGE_PATH:/data/unilink/storage}
logging:
  level:
    com.unilink: INFO
