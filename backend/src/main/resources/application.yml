spring:
  application:
    name: unilink-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/unilink_dev?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USER:unilink_app}
    password: ${DB_PASSWORD:app_dev_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${DB_URL:jdbc:mysql://localhost:3306/unilink_dev?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    user: ${DB_MIGRATION_USER:unilink_mig}
    password: ${DB_MIGRATION_PASSWORD:mig_dev_pass}
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 2h
  servlet:
    multipart:
      # D-029a caps (profile photo 2 MB, cover/ID/poster 5 MB, attachment 10 MB)
      # must be reachable: without this Spring Boot's 1 MB/file default rejects
      # larger uploads before the service validator runs.
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
server:
  port: 8080
  servlet:
    session:
      cookie:
        name: UL_SESSION
        http-only: true
        same-site: Lax
        secure: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  encryption-key: ${ENCRYPTION_KEY:dev-only-encryption-key-change-me}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/workspace/github/callback}
    frontend-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${LOCAL_STORAGE_PATH:./storage-dev}
  ocr:
    provider: ${OCR_PROVIDER:tesseract}
    data-path: ${OCR_DATA_PATH:}
    languages: ben+eng
  sms:
    provider: ${SMS_PROVIDER:log}
    api-url: ${SMS_API_URL:}
    api-key: ${SMS_API_KEY:}
    sender-id: ${SMS_SENDER_ID:UniLink}
  mail:
    from: ${MAIL_FROM:noreply@unilink.dev}
    host: ${SMTP_HOST:localhost}
  security:
    student-idle: 2h
    admin-idle: 30m
    login-max-attempts: 5
    login-lock: 15m
    csrf-enabled: true
    # D-100: only these direct peers may supply X-Forwarded-For (the nginx
    # front-end terminates on 127.0.0.1). Override with TRUSTED_PROXIES
    # when a real load balancer / proxy sits in front; never list a
    # client-facing address here — a listed proxy can assert any client IP.
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
logging:
  level:
    com.unilink: INFO
    org.springframework.security: WARN
